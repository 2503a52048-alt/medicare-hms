<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Dashboard – MediCare</title>
  <meta name="robots" content="noindex">
  <script src="/js/theme-init.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><a class="brand-link" href="/"><img src="/assets/logo.svg" alt="" width="36" height="36"><span>MediCare<small>DOCTOR PORTAL</small></span></a></div>
    <nav>
      <a class="side-link" href="#overview" data-view="overview"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a class="side-link" href="#today" data-view="today"><i class="bi bi-calendar-day"></i>Today's Appointments</a>
      <a class="side-link" href="#upcoming" data-view="upcoming"><i class="bi bi-calendar-week"></i>Upcoming</a>
      <a class="side-link" href="#history" data-view="history"><i class="bi bi-clock-history"></i>Completed &amp; Cancelled</a>
      <a class="side-link" href="#schedule" data-view="schedule"><i class="bi bi-calendar2-range"></i>Schedule &amp; Availability</a>
      <a class="side-link" href="#profile" data-view="profile"><i class="bi bi-person-badge"></i>My Profile</a>
      <a class="side-link" href="#reviews" data-view="reviews"><i class="bi bi-star"></i>Patient Reviews</a>
      <a class="side-link" href="#notifications" data-view="notifications"><i class="bi bi-bell"></i>Notifications</a>
    </nav>
    <div class="side-foot">
      <div class="sos-card mb-2"><i class="bi bi-exclamation-triangle-fill me-1"></i><strong>Emergency desk</strong><br>Call <a data-setting-tel="emergency_phone" href="tel:108" class="fw-bold text-reset"><span data-setting="emergency_phone">108</span></a></div>
      <button class="btn btn-outline-secondary w-100" data-action="logout"><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-outline-secondary d-lg-none" id="menuBtn" type="button" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h1 id="viewTitle">Dashboard</h1>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <a class="btn btn-outline-secondary bell" href="#notifications" aria-label="Notifications"><i class="bi bi-bell"></i><span class="badge rounded-pill bg-danger d-none" id="bellCount">0</span></a>
        <span class="d-none d-md-inline fw-semibold ms-1" data-me="name"></span>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/doctor.js"></script>
</body>
</html>
